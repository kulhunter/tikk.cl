<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>tikk | El salto digital para PyMEs y Emprendedores</title>
    
    <!-- SEO / AEO -->
    <meta name="description" content="Transforma tu Google Sheet en una tienda online de alto nivel. Solución profesional para PyMEs y Emprendedores. Creado por Dan Tagle.">
    
    <!-- Tailwind & UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: { 50: '#f5f5f7', 100: '#e8e8ed', 400: '#86868b', 500: '#1d1d1f', 600: '#121212', blue: '#0071e3' },
                        obsidian: '#000',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { background-color: #000; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
        .apple-glass { background: rgba(29, 29, 31, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .apple-card { background: #121212; border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .hero-gradient { background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
        .gradient-text { background: linear-gradient(135deg, #fff 0%, #86868b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        
        /* Timeline style */
        .step-line { position: absolute; left: 1.75rem; top: 2.5rem; bottom: 0; width: 2px; background: linear-gradient(to bottom, #0071e3, transparent); }
        
        /* Store Header Hero */
        #store-hero { height: 40vh; min-height: 300px; position: relative; overflow: hidden; }
    </style>
</head>
<body class="selection:bg-apple-blue selection:text-white pb-safe">

    <div id="notification-container" class="fixed top-8 right-8 z-[100] flex flex-col gap-4"></div>

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header Dinámico (Se oculta en Tienda) -->
        <header id="main-header" class="apple-glass sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-2">
                    <div class="h-8 w-8 bg-white rounded-lg flex items-center justify-center">
                        <i data-lucide="zap" class="text-black w-5 h-5"></i>
                    </div>
                    <span class="text-lg font-black tracking-tight tracking-wider">tikk</span>
                </a>
                
                <div class="flex items-center gap-6">
                    <a href="#" onclick="app.navigate('diy')" class="text-xs font-bold text-apple-400 hover:text-white transition-colors">Empezar ahora</a>
                </div>
            </div>
        </header>

        <!-- Contenido principal -->
        <main id="main-content" class="flex-grow">
            <!-- Templates se inyectan acá -->
        </main>

        <!-- Footer -->
        <footer id="main-footer" class="py-20 text-center border-t border-white/5 opacity-50">
            <p class="text-[10px] font-black uppercase tracking-[0.4em] mb-4">Empowering Entrepreneurs</p>
            <p class="text-[13px] font-medium text-white/50">
                Creado por <a href="https://dantagle.cl" target="_blank" class="text-apple-blue font-bold underline">Dan Tagle</a>
            </p>
        </footer>
    </div>

    <!-- Carrito Lateral (Store Mode) -->
    <aside id="cart-sidebar" class="fixed top-2 bottom-2 right-2 w-full max-w-sm bg-apple-600 rounded-[2.5rem] z-[70] translate-x-[110%] transition-transform duration-500 border border-white/10 shadow-2xl flex flex-col overflow-hidden">
        <div class="p-8 border-b border-white/5 flex justify-between items-center">
            <h2 class="text-xl font-bold italic">Tu Carrito</h2>
            <button onclick="app.toggleCart()" class="h-8 w-8 rounded-full bg-white/5 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-8 space-y-6"></div>
        <div class="p-8 bg-black/40 space-y-6">
            <div class="space-y-4">
                <input type="text" id="buyer-name" placeholder="Tu Nombre Completo" class="w-full h-12 px-5 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-apple-blue font-medium text-sm">
                <input type="text" id="buyer-address" placeholder="Dirección de envío" class="w-full h-12 px-5 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-apple-blue font-medium text-sm">
            </div>
            <div class="flex justify-between items-center">
                <span class="text-apple-400 text-xs font-bold uppercase tracking-widest">Total</span>
                <span id="cart-total" class="text-3xl font-black">$0</span>
            </div>
            <button onclick="app.sendOrder()" class="w-full h-14 bg-apple-blue text-white rounded-2xl font-bold flex items-center justify-center gap-3">
                <i data-lucide="message-circle" class="w-5 h-5"></i> Enviar por WhatsApp
            </button>
        </div>
    </aside>

    <!-- TEMPLATES -->

    <!-- Template: Landing (Explica para humanos) -->
    <template id="tpl-landing">
        <div class="max-w-7xl mx-auto px-6 pt-24 pb-48 text-center relative">
            <div class="inline-block px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-[10px] font-black uppercase tracking-widest text-apple-400 mb-8 italic">El futuro del comercio simplificado</div>
            <h1 class="text-6xl md:text-[110px] font-black tracking-tighter leading-[0.85] mb-12 gradient-text">
                Tu tienda pro, <br> solo con <br> un Excel.
            </h1>
            <p class="text-xl md:text-2xl text-apple-400 max-w-2xl mx-auto mb-16 font-medium leading-relaxed">
                El salto digital definitivo para <span class="text-white">PyMEs y Emprendedores</span>. <br>
                Actualiza tu stock en segundos sin tocar una sola línea de código.
            </p>
            <div class="flex flex-col sm:flex-row gap-6 justify-center items-center">
                <button onclick="app.navigate('diy')" class="h-16 px-12 bg-white text-black rounded-full font-black text-xl hover:scale-105 active:scale-95 transition-all shadow-2xl">
                    Crear mi tienda ahora
                </button>
                <div class="text-left bg-white/5 border border-white/10 p-5 rounded-[1.5rem] max-w-xs">
                    <p class="text-[10px] font-black text-apple-blue uppercase mb-2">Asesoría Dan Tagle</p>
                    <p class="text-xs text-apple-400 italic">"Yo configuro todo por ti". <a href="https://calendly.com/dan-tagle/30min" target="_blank" class="text-white underline font-bold">Reserva aquí (1 UF)</a>.</p>
                </div>
            </div>

            <!-- Onboarding: Step by Step -->
            <div class="mt-40 text-left max-w-2xl mx-auto space-y-20 relative">
                <div class="step-line"></div>
                
                <div class="flex gap-8 relative">
                    <div class="h-14 w-14 rounded-2xl bg-apple-blue flex items-center justify-center flex-shrink-0 shadow-lg shadow-apple-blue/20 z-10"><i data-lucide="file-spreadsheet" class="text-white w-7 h-7"></i></div>
                    <div>
                        <h3 class="text-3xl font-black mb-3 italic">1. Llena tu Excel</h3>
                        <p class="text-apple-400 leading-relaxed">Imagina que tu Excel es tu bodega. Escribe el nombre del producto, el precio y cuántos tienes. ¡Tan fácil como anotar en un cuaderno!</p>
                    </div>
                </div>

                <div class="flex gap-8 relative">
                    <div class="h-14 w-14 rounded-2xl bg-apple-blue flex items-center justify-center flex-shrink-0 shadow-lg shadow-apple-blue/20 z-10"><i data-lucide="link" class="text-white w-7 h-7"></i></div>
                    <div>
                        <h3 class="text-3xl font-black mb-3 italic">2. Conéctalo aquí</h3>
                        <p class="text-apple-400 leading-relaxed">Pega el link de ese Excel abajo. El sistema leerá tu lista y creará una vitrina hermosa y profesional automáticamente.</p>
                    </div>
                </div>

                <div class="flex gap-8 relative">
                    <div class="h-14 w-14 rounded-2xl bg-apple-blue flex items-center justify-center flex-shrink-0 shadow-lg shadow-apple-blue/20 z-10"><i data-lucide="share-2" class="text-white w-7 h-7"></i></div>
                    <div>
                        <h3 class="text-3xl font-black mb-3 italic">3. ¡Comparte y vende!</h3>
                        <p class="text-apple-400 leading-relaxed">Obtendrás un link para poner en tu Instagram. Los pedidos de tus clientes te llegarán como un mensaje de WhatsApp directo a tu celular.</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: DIY (Selector de País) -->
    <template id="tpl-diy">
        <div class="max-w-xl mx-auto px-6 py-24">
            <h2 class="text-4xl font-black mb-12 text-center gradient-text italic">Información de tu marca</h2>
            
            <div class="space-y-6">
                <!-- Nombre Tienda -->
                <div class="apple-card p-8 rounded-4xl">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-apple-400 mb-4">¿Cómo se llama tu negocio?</label>
                    <input type="text" id="store-name-input" placeholder="Ej: Elite Sneakers" class="w-full h-14 px-6 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-apple-blue text-lg font-bold transition-all">
                </div>

                <!-- Teléfono con Selector de País -->
                <div class="apple-card p-8 rounded-4xl">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-apple-400 mb-4">Tu WhatsApp de ventas</label>
                    <div class="flex gap-3">
                        <select id="country-code" class="h-14 px-4 rounded-2xl bg-white/5 border border-white/10 outline-none text-sm font-bold text-apple-400 focus:border-apple-blue">
                            <option value="56" selected>🇨🇱 +56</option>
                            <option value="54">🇦🇷 +54</option>
                            <option value="52">🇲🇽 +52</option>
                            <option value="57">🇨🇴 +57</option>
                            <option value="51">🇵🇪 +51</option>
                            <option value="598">🇺🇾 +598</option>
                            <option value="34">🇪🇸 +34</option>
                        </select>
                        <input type="number" id="whatsapp-input" placeholder="Ej: 912345678" class="flex-grow h-14 px-6 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-apple-blue text-lg font-bold transition-all">
                    </div>
                </div>

                <!-- Link Sheets -->
                <div class="apple-card p-8 rounded-4xl space-y-4">
                    <div class="flex justify-between items-end">
                        <label class="text-[10px] font-black uppercase tracking-widest text-apple-400">Link del Google Sheet</label>
                        <a href="https://docs.google.com/spreadsheets/d/1EbB2_MSQnVYwrseGX2jbDXu4ttWDhSbMxzbfWRy7orU/edit#gid=0" target="_blank" class="text-[9px] font-black text-apple-blue underline">Ver Plantilla Ejemplo</a>
                    </div>
                    <input type="text" id="sheet-url-input" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full h-14 px-6 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-apple-blue text-sm font-medium">
                </div>

                <button onclick="app.generateFromDiy()" class="w-full h-16 bg-white text-black rounded-3xl font-black text-xl shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all">
                    Generar mi tienda profesional
                </button>
            </div>
        </div>
    </template>

    <!-- Template: SHARE (Grandes Botones) -->
    <template id="tpl-share">
        <div class="max-w-3xl mx-auto px-6 py-24 text-center">
            <h2 class="text-5xl font-black mb-4 gradient-text italic">¡Configuración Exitosa!</h2>
            <p class="text-apple-400 font-medium mb-16">Has dado el salto. ¿Qué quieres hacer ahora?</p>

            <div class="grid md:grid-cols-2 gap-8">
                <!-- Ver Tienda -->
                <div class="apple-card p-10 rounded-[3rem] space-y-6 flex flex-col justify-between items-center border-apple-blue/20">
                    <div class="h-14 w-14 bg-apple-blue/10 rounded-2xl flex items-center justify-center text-apple-blue"><i data-lucide="eye" class="w-7 h-7"></i></div>
                    <h3 id="share-store-name" class="text-2xl font-black">Mi Tienda Elite</h3>
                    <p class="text-apple-400 text-sm">Usa el link gratuito de tikk.cl para empezar a vender hoy mismo.</p>
                    <a href="#" id="view-store-btn" target="_blank" class="w-full h-14 bg-apple-blue text-white rounded-2xl font-black flex items-center justify-center gap-2 shadow-xl shadow-apple-blue/20">
                        VER MI TIENDA
                    </a>
                    <button onclick="app.copyStoreLink()" class="text-xs font-bold text-apple-400 flex items-center gap-2 hover:text-white transition-colors">
                        <i data-lucide="copy" class="w-3 h-3"></i> Copiar link para Instagram
                    </button>
                </div>

                <!-- Descargar -->
                <div class="apple-card p-10 rounded-[3rem] bg-indigo-600 flex flex-col justify-between items-center border-none shadow-2xl">
                    <div class="h-14 w-14 bg-white/20 rounded-2xl flex items-center justify-center text-white"><i data-lucide="download-cloud" class="w-7 h-7"></i></div>
                    <h3 class="text-2xl font-black text-white">Versión Pro</h3>
                    <p class="text-indigo-100 text-sm opacity-80">Descarga los archivos para instalar la tienda en tu propio dominio.</p>
                    <button onclick="app.downloadProZip()" class="w-full h-14 bg-white text-black rounded-2xl font-black flex items-center justify-center gap-2 shadow-2xl shadow-indigo-900/40">
                        DESCARGAR PROYECTO (.zip)
                    </button>
                    <button onclick="app.editStoreData()" class="text-xs font-bold text-indigo-200 hover:text-white transition-colors underline opacity-50">Editar datos (si te equivocaste)</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: STORE (Hero Header Dinámico) -->
    <template id="tpl-store">
        <div>
            <!-- HERO HEADER -->
            <div id="store-hero" class="bg-apple-500">
                <img id="store-hero-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 hero-gradient"></div>
                <div class="absolute inset-0 flex items-center justify-center text-center p-6">
                    <h2 id="store-title" class="text-4xl md:text-7xl font-black text-white italic tracking-tighter drop-shadow-2xl"></h2>
                </div>
            </div>

            <!-- CONTENIDO TIENDA -->
            <div class="max-w-7xl mx-auto px-6 py-12 pb-40">
                <div class="flex flex-col md:flex-row justify-between items-center gap-8 mb-16 border-b border-white/5 pb-10">
                    <div class="relative w-full max-w-sm">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-apple-400"></i>
                        <input type="text" id="store-search" placeholder="Busca productos..." oninput="app.handleSearch(this.value)" class="w-full h-12 pl-12 pr-6 rounded-[1.2rem] bg-white/5 border border-white/10 outline-none focus:border-apple-blue font-medium text-sm">
                    </div>
                    <div id="category-filters" class="flex flex-wrap items-center justify-center gap-3"></div>
                    <button onclick="app.toggleCart()" class="h-12 px-6 bg-white/5 border border-white/10 rounded-full font-bold flex items-center gap-3 hover:bg-white/10 transition-all group">
                        <i data-lucide="shopping-basket" class="w-5 h-5 text-apple-blue group-hover:scale-110 transition-transform"></i>
                        BOLSA (<span id="cart-count-btn">0</span>)
                    </button>
                </div>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
