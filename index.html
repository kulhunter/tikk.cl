<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tikk | Tu tienda online Pro en segundos con Google Sheets</title>
    
    <!-- SEO Master -->
    <meta name="description" content="Crea una tienda online profesional con carrito y pedidos por WhatsApp usando solo Google Sheets. Sin programación, sin servidores. La solución más rápida para vender online.">
    <meta name="keywords" content="crear tienda online, google sheets a tienda, ventas whatsapp, ecommerce rapido, tikk cl, dan tagle">
    <meta name="author" content="Dan Tagle">
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="tikk | De Google Sheets a Tienda Online">
    <meta property="og:description" content="Conecta tu Excel y empieza a vender. Carrito de compras y pedidos por WhatsApp integrados.">
    <meta property="og:image" content="https://tikk.cl/icon-512.png">
    <meta property="og:url" content="https://tikk.cl/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "tikk",
      "operatingSystem": "Web",
      "applicationCategory": "BusinessApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Transforma un Google Sheet en una tienda online con carrito y WhatsApp."
    }
    </script>
    
    <!-- Tailwind & UI Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tech: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        dark: '#0f172a',
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --app-height: 100%; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        
        /* Glassmorphism */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }
        
        .tech-card {
            background: white;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tech-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .gradient-border {
            position: relative;
            background: white;
            border-radius: 2rem;
        }

        .gradient-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            z-index: -1;
            border-radius: 2.1rem;
            opacity: 0.15;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 5s ease-in-out infinite; }

        /* Mobile specific */
        @media (max-width: 640px) {
            .mobile-dock {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Cart Animation */
        #cart-sidebar { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        [v-cloak] { display: none; }
    </style>
</head>
<body class="text-slate-900 selection:bg-tech-100 selection:text-tech-700">

    <!-- Notifications -->
    <div id="notification-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="glass-nav sticky top-0 z-50 border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-2.5">
                    <div class="h-10 w-10 bg-tech-600 rounded-xl flex items-center justify-center shadow-lg shadow-tech-100 transform rotate-3">
                        <i data-lucide="zap" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="text-2xl font-black tracking-tight text-dark">tikk<span class="text-tech-500">.</span></span>
                </a>
                
                <div class="flex items-center gap-2">
                    <button id="cart-button" onclick="app.toggleCart()" class="hidden relative p-2.5 text-slate-600 hover:text-tech-600 transition-all active:scale-90">
                        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                        <span id="cart-count" class="absolute top-1 right-1 bg-tech-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
                    </button>
                    <button onclick="app.navigate('diy')" class="hidden sm:block bg-dark text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-slate-800 transition-all shadow-xl shadow-slate-200">
                        Crear Tienda
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-grow relative">
            <!-- Templates will be injected here -->
        </main>

        <!-- Mobile Navigation Dock (Only on Home/DIY) -->
        <nav id="mobile-dock" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-dark/90 text-white backdrop-blur-xl px-6 py-3 rounded-full flex items-center gap-8 shadow-2xl sm:hidden transition-all duration-300">
            <button onclick="app.navigate('landing')" class="flex flex-col items-center gap-1 opacity-60 hover:opacity-100 transition-opacity">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>
            <button onclick="app.navigate('diy')" class="p-4 bg-tech-500 rounded-full -mt-10 shadow-lg shadow-tech-500/40 active:scale-90 transition-transform">
                <i data-lucide="plus" class="w-6 h-6 text-white"></i>
            </button>
            <button onclick="app.toggleCart()" id="dock-cart-btn" class="flex flex-col items-center gap-1 opacity-60 hover:opacity-100 transition-opacity">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            </button>
        </nav>
    </div>

    <!-- CART DRAWERS (Sidebar for Desk, Bottom for Mobile) -->
    <div id="cart-overlay" class="fixed inset-0 bg-dark/40 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <aside id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-lg bg-white z-[70] translate-x-full shadow-2xl flex flex-col sm:rounded-l-4xl">
        <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between">
            <div>
                <h2 class="text-2xl font-black text-dark">Tu Carrito</h2>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">Checking moments</p>
            </div>
            <button onclick="app.toggleCart()" class="h-10 w-10 flex items-center justify-center bg-slate-50 rounded-full hover:bg-slate-100 transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto px-8 py-6 space-y-4">
            <!-- Items injected here -->
        </div>

        <div class="px-8 py-8 border-t border-slate-50 bg-slate-50/50 space-y-6">
            <div class="space-y-3">
                <div class="relative group">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="buyer-name" placeholder="Tu Nombre" class="w-full pl-12 pr-6 py-4 rounded-2xl border border-slate-100 bg-white focus:border-tech-500 focus:ring-4 focus:ring-tech-500/5 outline-none font-semibold transition-all shadow-sm">
                </div>
                <div class="relative group">
                    <i data-lucide="message-square" class="absolute left-4 top-4 w-4 h-4 text-slate-400"></i>
                    <textarea id="order-comments" placeholder="Nota adicional..." class="w-full pl-12 pr-6 py-4 rounded-2xl border border-slate-100 bg-white focus:border-tech-500 focus:ring-4 focus:ring-tech-500/5 outline-none font-semibold transition-all shadow-sm resize-none" rows="2"></textarea>
                </div>
            </div>
            
            <div class="flex justify-between items-center px-2">
                <span class="text-slate-500 font-bold">Total del Pedido</span>
                <span id="cart-total" class="text-4xl font-black text-dark">$0</span>
            </div>
            
            <button onclick="app.sendOrder()" class="w-full bg-tech-600 text-white py-5 rounded-3xl font-black text-lg hover:bg-tech-700 transition-all shadow-xl shadow-tech-200 flex items-center justify-center gap-3 active:scale-95">
                <i data-lucide="message-circle" class="w-6 h-6"></i>
                Enviar por WhatsApp
            </button>
            <p class="text-[10px] text-center text-slate-400 px-8">Al enviar, serás redirigido a WhatsApp para finalizar el pago y coordinar el envío con el vendedor.</p>
        </div>
    </aside>

    <!-- Templates -->
    <template id="tpl-landing">
        <div class="relative">
            <!-- Hero Gradient -->
            <div class="absolute top-0 inset-x-0 h-[800px] bg-gradient-to-b from-tech-50 via-white to-transparent -z-10"></div>
            
            <section class="max-w-7xl mx-auto px-5 pt-16 pb-32">
                <div class="flex flex-col items-center text-center">
                    <div class="bg-tech-100 text-tech-600 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest mb-8 border border-tech-200">
                        ⚡️ La forma más inteligente de vender
                    </div>
                    
                    <h1 class="text-5xl md:text-8xl font-black tracking-tight text-dark leading-[0.9] mb-8">
                        Vende online <br class="hidden md:block"> con tu <span class="text-transparent bg-clip-text bg-gradient-to-r from-tech-500 to-violet-500">Excel</span>.
                    </h1>
                    
                    <p class="text-xl text-slate-500 max-w-2xl mb-12 font-medium leading-relaxed">
                        Transforma tu Google Sheet en una tienda profesional con carrito y WhatsApp. <span class="text-dark font-bold">Sin configuración, sin servidores, sin límites.</span>
                    </p>

                    <div class="flex flex-col sm:flex-row gap-4 w-full max-w-lg mb-20">
                        <button onclick="app.navigate('diy')" class="flex-1 bg-dark text-white py-5 rounded-3xl font-black text-lg shadow-2xl shadow-slate-300 hover:scale-[1.02] transition-all flex items-center justify-center gap-2">
                            Empieza Gratis
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                        <a href="https://calendly.com/dan-tagle/30min" target="_blank" class="flex-1 bg-white border border-slate-100 text-dark py-5 rounded-3xl font-black text-lg hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                            Agenda Especialista
                        </a>
                    </div>

                    <!-- Tech Cards -->
                    <div class="grid md:grid-cols-3 gap-8 w-full">
                        <div class="tech-card p-10 rounded-4xl text-left bg-white relative overflow-hidden group">
                            <div class="h-20 w-20 bg-tech-50 text-tech-500 rounded-3xl flex items-center justify-center mb-8 rotate-3">
                                <i data-lucide="smartphone" class="w-10 h-10"></i>
                            </div>
                            <h3 class="text-2xl font-black mb-4">Móvil Nativo</h3>
                            <p class="text-slate-500 font-medium">Diseñado para que tus clientes compren desde el celular tan rápido como chatear por WhatsApp.</p>
                        </div>
                        <div class="tech-card p-10 rounded-4xl text-left bg-white relative overflow-hidden group">
                            <div class="h-20 w-20 bg-green-50 text-green-500 rounded-3xl flex items-center justify-center mb-8 -rotate-3">
                                <i data-lucide="database" class="w-10 h-10"></i>
                            </div>
                            <h3 class="text-2xl font-black mb-4">Base de datos Drive</h3>
                            <p class="text-slate-500 font-medium">Usa Google Sheets para controlar tu inventario. Cambia un precio en tu Excel y se actualiza al instante.</p>
                        </div>
                        <div class="tech-card p-10 rounded-4xl text-left bg-white relative overflow-hidden group">
                            <div class="h-20 w-20 bg-violet-50 text-violet-500 rounded-3xl flex items-center justify-center mb-8 rotate-[8deg]">
                                <i data-lucide="share-2" class="w-10 h-10"></i>
                            </div>
                            <h3 class="text-2xl font-black mb-4">SEO Autogenerado</h3>
                            <p class="text-slate-500 font-medium">URLs limpias y amigables. Tu tienda está optimizada para aparecer en los mejores resultados de Google.</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <template id="tpl-diy">
        <div class="max-w-4xl mx-auto px-5 py-16">
            <header class="text-center mb-16">
                <h2 class="text-4xl md:text-6xl font-black text-dark tracking-tighter mb-4">Configura tu Tienda</h2>
                <p class="text-slate-500 font-medium">Sigue los 3 pasos tecnológicos para lanzar tu marca.</p>
            </header>

            <div class="space-y-10 relative">
                <!-- Step 1 -->
                <div class="gradient-border p-8 md:p-12 shadow-2xl">
                    <div class="flex flex-col md:flex-row gap-8">
                        <div class="h-14 w-14 bg-dark text-white rounded-2xl flex items-center justify-center text-2xl font-black flex-shrink-0">1</div>
                        <div class="space-y-6">
                            <h3 class="text-2xl font-bold">Tu Inventario en Excel</h3>
                            <p class="text-slate-600 font-medium">Primero, crea tu base de datos en Google Sheets. Debe tener estas 6 columnas obligatorias.</p>
                            
                            <a href="https://docs.google.com/spreadsheets/d/1EbB2_MSQnVYwrseGX2jbDXu4ttWDhSbMxzbfWRy7orU/edit?gid=0#gid=0" target="_blank" class="inline-flex items-center gap-3 bg-green-50 text-green-700 px-6 py-4 rounded-2xl font-bold hover:bg-green-100 transition-all border border-green-200">
                                <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
                                Copiar mi Excel de Ejemplo
                            </a>
                            
                            <div class="bg-blue-50 border border-blue-100 p-5 rounded-2xl flex gap-4 text-sm text-blue-700 font-medium">
                                <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
                                Recuerda compartir tu archivo como "Cualquiera con el enlace puede ver".
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="gradient-border p-8 md:p-12 shadow-2xl">
                    <div class="flex flex-col md:flex-row gap-8">
                        <div class="h-14 w-14 bg-tech-600 text-white rounded-2xl flex items-center justify-center text-2xl font-black flex-shrink-0">2</div>
                        <div class="w-full space-y-6">
                            <h3 class="text-2xl font-bold">Ventas por WhatsApp</h3>
                            <div class="space-y-4">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Tu número (ej: 56912345678)</label>
                                <input type="number" id="whatsapp-input" placeholder="Ingresa tu número" class="w-full px-8 py-5 rounded-3xl bg-slate-50 border border-slate-100 focus:bg-white focus:ring-4 focus:ring-tech-500/10 outline-none text-xl font-bold transition-all">
                            </div>
                            <div class="space-y-4">
                                <label class="text-xs font-black uppercase tracking-widest text-slate-400">Nombre de tu Tienda</label>
                                <input type="text" id="store-name-input" placeholder="Ej: MiBazarPro" class="w-full px-8 py-5 rounded-3xl bg-slate-50 border border-slate-100 focus:bg-white focus:ring-4 focus:ring-tech-500/10 outline-none text-xl font-bold transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="gradient-border p-8 md:p-12 shadow-2xl">
                    <div class="flex flex-col md:flex-row gap-8">
                        <div class="h-14 w-14 bg-violet-600 text-white rounded-2xl flex items-center justify-center text-2xl font-black flex-shrink-0">3</div>
                        <div class="w-full space-y-6">
                            <h3 class="text-2xl font-bold">Enlace del Google Sheet</h3>
                            <input type="text" id="sheet-url-input" placeholder="Pega el link de Google Drive aquí" class="w-full px-8 py-5 rounded-3xl bg-slate-50 border border-slate-100 focus:bg-white focus:ring-4 focus:ring-tech-500/10 outline-none text-lg font-bold transition-all">
                            <button onclick="app.generateFromDiy()" class="w-full bg-dark text-white py-6 rounded-4xl font-black text-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3 shadow-2xl shadow-slate-300 transform hover:scale-[1.02] active:scale-95">
                                Generar Mi Tienda Online
                                <i data-lucide="rocket" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-share">
        <div class="max-w-xl mx-auto px-5 py-24 text-center">
            <div class="h-24 w-24 bg-green-100 text-green-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-10 shadow-inner group">
                <i data-lucide="check" class="w-12 h-12 group-hover:scale-110 transition-transform"></i>
            </div>
            
            <h2 class="text-4xl font-black text-dark mb-4">¡Tienda Configurada!</h2>
            <p class="text-slate-500 text-lg mb-12">Tu tienda ahora está online. Comparte este enlace exclusivo para recibir pedidos.</p>
            
            <div class="bg-white p-8 rounded-[3rem] shadow-2xl border border-slate-50 space-y-8">
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 flex items-center gap-4 relative group">
                    <input type="text" id="shareable-url" readonly class="bg-transparent border-none outline-none w-full text-slate-600 font-bold text-sm truncate">
                    <button onclick="app.copyStoreLink()" class="bg-dark text-white p-4 rounded-2xl hover:bg-tech-600 transition-all active:scale-90 flex-shrink-0">
                        <i data-lucide="copy" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="flex flex-col gap-3">
                    <a href="#" id="view-store-btn" class="w-full bg-tech-600 text-white py-5 rounded-3xl font-black text-lg hover:bg-tech-700 shadow-xl shadow-tech-200 transition-all flex items-center justify-center gap-3">
                        Ir a mi tienda
                        <i data-lucide="external-link" class="w-5 h-5"></i>
                    </a>
                    <button onclick="app.navigate('diy')" class="w-full text-slate-500 font-bold py-4 hover:text-dark transition-colors">Volver a editar</button>
                </div>
            </div>

            <div class="mt-16 flex items-center justify-center gap-8 opacity-40">
                <i data-lucide="globe" class="w-8 h-8"></i>
                <i data-lucide="shield-check" class="w-8 h-8"></i>
                <i data-lucide="zap" class="w-8 h-8"></i>
            </div>
        </div>
    </template>

    <template id="tpl-store">
        <div id="store-view" class="max-w-7xl mx-auto px-5 py-10 pb-32">
            <header class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-16">
                <div>
                    <h2 id="store-title" class="text-5xl font-black text-dark tracking-tighter mb-3 animate-float">Catálogo de Productos</h2>
                    <div class="flex items-center gap-3">
                        <div class="inline-flex items-center gap-2 bg-green-50 text-green-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-green-100">
                             Online
                        </div>
                        <p class="text-slate-400 text-sm font-medium">Gestión vía Google Sheets</p>
                    </div>
                </div>
                
                <div id="category-filters" class="flex flex-wrap gap-2"></div>
            </header>

            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-8 gap-y-12">
                <!-- Loading State -->
                <div class="col-span-full py-40 flex flex-col items-center justify-center gap-6">
                    <div class="w-16 h-16 border-4 border-slate-100 border-t-tech-500 rounded-full animate-spin"></div>
                    <p class="text-slate-400 font-bold tracking-widest uppercase text-xs">Accediendo a la base de datos...</p>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
