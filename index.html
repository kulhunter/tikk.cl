<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>tikk | Vitrinas Digitales Boutique</title>
    
    <meta name="description" content="Vitrinas digitales de alto nivel. Exclusivo para emprendedores pro.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lux: { 50: '#f9f9f9', 100: '#efefef', 400: '#8e8e93', 500: '#1c1c1e', 600: '#000000', blue: '#0066cc' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { background-color: #000; color: #fff; -webkit-font-smoothing: antialiased; }
        .lux-glass { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .lux-card { background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 2rem; transition: all 0.4s ease; }
        .lux-card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-4px); }
        
        /* Prevenir que el botón se rompa */
        .no-wrap { white-space: nowrap; }
        
        #store-hero { height: 50vh; min-height: 400px; position: relative; background-color: #111; overflow: hidden; }
        .hero-overlay { background: linear-gradient(to top, #000 0%, rgba(0,0,0,0.4) 50%, transparent 100%); }
        
        ::-webkit-scrollbar { display: none; }
        
        #product-modal { transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1); }
        .drawer-open { transform: translateY(0) !important; }
        .drawer-closed { transform: translateY(100%) !important; }
        @media (min-width: 768px) { .drawer-closed { transform: translateX(100%) translateY(0) !important; } }
    </style>
</head>
<body class="selection:bg-lux-blue selection:text-white">

    <div id="notification-container" class="fixed top-6 right-6 z-[200] flex flex-col gap-3"></div>

    <div id="app" class="min-h-screen flex flex-col">
        
        <header id="main-header" class="lux-glass sticky top-0 z-[100]">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-white rounded-xl flex items-center justify-center">
                        <i data-lucide="zap" class="text-black w-6 h-6 fill-current"></i>
                    </div>
                    <span class="text-2xl font-black italic tracking-tighter">tikk</span>
                </a>
                <button onclick="app.navigate('diy')" class="bg-white text-black px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest">Crear Boutique</button>
            </div>
        </header>

        <main id="main-content" class="flex-grow">
            <!-- Content will be injected -->
        </main>

        <footer id="global-footer" class="py-20 border-t border-white/5 bg-black">
            <div class="max-w-7xl mx-auto px-6 text-center">
                <p class="text-[9px] font-black uppercase tracking-[0.6em] text-white/30 mb-8">Official Platform</p>
                <a href="https://dantagle.cl" target="_blank" class="text-2xl font-black tracking-tighter hover:text-lux-blue transition-colors">Dan Tagle<span class="text-lux-blue">.</span></a>
            </div>
        </footer>
    </div>

    <!-- Modals (Overlay & Drawer) -->
    <div id="modal-overlay" onclick="app.closeProductModal()" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[150] opacity-0 pointer-events-none transition-opacity duration-500"></div>
    <aside id="product-modal" class="fixed bottom-0 right-0 h-[85vh] md:h-full w-full md:max-w-xl bg-lux-500 z-[160] drawer-closed shadow-2xl flex flex-col md:border-l border-white/10 rounded-t-[3rem] md:rounded-l-[3rem] md:rounded-t-none">
        <button onclick="app.closeProductModal()" class="absolute top-8 right-8 h-10 w-10 rounded-full bg-white/5 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>
        <div id="modal-content" class="flex-grow overflow-y-auto p-10 pt-16"></div>
        <div id="modal-actions" class="p-10 border-t border-white/5 bg-black/40 grid grid-cols-2 gap-4"></div>
    </aside>

    <!-- UI TEMPLATES -->

    <template id="tpl-landing">
        <div class="max-w-7xl mx-auto px-6 pt-24 pb-48">
            <div class="max-w-3xl">
                <h1 class="text-6xl md:text-[120px] font-black tracking-tighter leading-[0.8] mb-12">
                    Vende <br> <span class="italic text-lux-blue">superior</span>.
                </h1>
                <p class="text-xl md:text-2xl text-lux-400 font-medium mb-16 leading-relaxed max-w-xl">
                    Tu stock en Google Sheets convertido en una boutique digital de alta gama. Sin códigos, solo diseño.
                </p>
                <div class="flex flex-wrap gap-6">
                    <button onclick="app.navigate('diy')" class="h-16 px-12 bg-white text-black rounded-2xl font-black text-lg">Empezar ahora</button>
                    <a href="https://docs.google.com/spreadsheets/d/1EbB2_MSQnVYwrseGX2jbDXu4ttWDhSbMxzbfWRy7orU/edit#gid=0" target="_blank" class="h-16 px-10 border border-white/10 rounded-2xl font-bold flex items-center text-xs uppercase tracking-widest hover:bg-white/5">Ver Plantilla Excel</a>
                </div>
            </div>
            
            <div id="tutorial" class="mt-48 grid md:grid-cols-2 gap-20 border-t border-white/5 pt-24 text-left">
                <div>
                    <h3 class="text-sm font-black uppercase tracking-[0.3em] text-lux-blue mb-6">El Método</h3>
                    <p class="text-3xl font-bold italic leading-tight">Actualiza tu Excel, nosotros hacemos el resto. La web se sincroniza al instante.</p>
                </div>
                <div class="flex flex-col gap-8">
                    <button onclick="app.shareWithFriend()" class="w-full h-16 border border-white/5 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-white/5 transition-all uppercase text-[10px] tracking-widest"><i data-lucide="share" class="w-4 h-4"></i> Recomendar a un amigo emprendedor</button>
                    <p class="text-white/30 text-xs italic">Ideal para tiendas de ropa, accesorios, arte y gastronomía pro.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-diy">
        <div class="max-w-xl mx-auto px-6 py-24">
            <h2 class="text-4xl font-black italic mb-12 text-center">Configura tu Boutique</h2>
            <div class="lux-card p-10 space-y-10">
                <div>
                    <label class="text-[9px] font-black uppercase tracking-[0.3em] text-lux-400 mb-4 block">Nombre boutique</label>
                    <input type="text" id="store-name-input" placeholder="Nombre Boutique" class="w-full bg-transparent border-b border-white/10 py-4 text-3xl font-black outline-none focus:border-lux-blue">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase tracking-[0.3em] text-lux-400 mb-4 block">WhatsApp</label>
                    <div class="flex gap-4">
                        <select id="country-code" class="bg-white/5 px-3 rounded-xl font-bold border border-white/10 outline-none">
                            <option value="56">🇨🇱 +56</option>
                            <option value="54">🇦🇷 +54</option>
                            <option value="52">🇲🇽 +52</option>
                            <option value="57">🇨🇴 +57</option>
                            <option value="34">🇪🇸 +34</option>
                        </select>
                        <input type="number" id="whatsapp-input" placeholder="912345678" class="flex-grow bg-transparent border-b border-white/10 py-4 text-3xl font-black outline-none focus:border-lux-blue">
                    </div>
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase tracking-[0.3em] text-lux-400 mb-4 block">ID Google Sheet</label>
                    <input type="text" id="sheet-url-input" placeholder="Pega el link de tu Excel aquí" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none text-sm">
                </div>
            </div>
            <button onclick="app.generateFromDiy()" class="w-full h-20 bg-white text-black rounded-[2rem] font-black text-xl mt-8 shadow-2xl">Generar Vitrina</button>
        </div>
    </template>

    <template id="tpl-share">
        <div class="max-w-4xl mx-auto px-6 py-24 text-center">
            <h2 class="text-5xl font-black mb-16 italic">¡Boutique Creada!</h2>
            <div class="grid md:grid-cols-2 gap-8">
                <div class="lux-card p-12 text-center flex flex-col items-center">
                    <h3 id="share-store-name" class="text-2xl font-black mb-10">Boutique</h3>
                    <a href="#" id="view-store-btn" target="_blank" class="w-full h-16 bg-white text-black rounded-2xl font-black flex items-center justify-center">VER TIENDA</a>
                    <button onclick="app.copyStoreLink()" class="mt-6 text-xs font-bold text-lux-blue uppercase tracking-widest">Copiar Link</button>
                    <input type="hidden" id="shareable-url">
                </div>
                <div class="lux-card p-12 bg-lux-blue border-none flex flex-col items-center">
                    <h3 class="text-2xl font-black mb-10">Versión ZIP</h3>
                    <button onclick="app.downloadProZip()" class="w-full h-16 bg-white text-black rounded-2xl font-black flex items-center justify-center">DESCARGAR</button>
                    <button onclick="app.editStoreData()" class="mt-6 text-xs font-black text-white/50 hover:text-white uppercase tracking-widest italic">Editar Datos</button>
                </div>
            </div>
            
            <div class="mt-20 pt-16 border-t border-white/5 max-w-2xl mx-auto">
                <h4 class="text-xl font-bold mb-8 italic">¿Quieres usar tu propio dominio (tutienda.cl)?</h4>
                <div class="grid sm:grid-cols-2 gap-4">
                    <button onclick="app.toggleDomainModal(true)" class="h-16 px-6 lux-card rounded-2xl font-bold text-sm">Ver Guía PDF</button>
                    <a href="https://calendly.com/dan-tagle/30min" target="_blank" class="h-16 px-6 bg-lux-blue rounded-2xl font-black flex flex-col items-center justify-center leading-tight">
                        <span class="text-[9px] uppercase opacity-60">Yo lo hago por ti</span>
                        <span class="text-sm">1 UF + Dominio .cl</span>
                    </a>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-store">
        <div class="bg-black min-h-screen">
            <div id="store-hero">
                <img id="store-hero-img" src="" class="absolute inset-0 w-full h-full object-cover">
                <div class="absolute inset-0 hero-overlay"></div>
                <div class="absolute inset-x-0 bottom-16 flex flex-col items-center text-center px-6">
                    <h1 id="store-title" class="text-5xl md:text-9xl font-black italic tracking-tighter text-white drop-shadow-2xl"></h1>
                    <div class="mt-4 text-[10px] font-black uppercase tracking-[0.6em] text-white/40">Powered by Dan Tagle</div>
                </div>
            </div>

            <div class="max-w-7xl mx-auto px-6 py-20 pb-40">
                <!-- Sub-header UX Mejorada -->
                <div class="flex flex-col xl:flex-row justify-between items-center gap-8 mb-24 border-b border-white/5 pb-12">
                    <div class="relative w-full max-w-md">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 w-4 h-4 text-white/20"></i>
                        <input type="text" id="store-search" placeholder="Busca productos..." oninput="app.handleSearch(this.value)" class="w-full h-14 pl-14 pr-6 rounded-2xl bg-white/5 border border-white/10 outline-none text-sm transition-all focus:bg-white/10">
                    </div>
                    
                    <div id="category-filters" class="flex flex-wrap items-center justify-center gap-2"></div>
                    
                    <!-- Bolsa Blindada Fix -->
                    <button onclick="app.toggleCart()" class="h-14 px-8 bg-white/5 border border-white/5 rounded-full font-black text-[11px] uppercase tracking-widest flex items-center gap-4 hover:bg-white/10 transition-all no-wrap flex-shrink-0">
                        <span>Mi Bolsa</span>
                        <span id="cart-count-btn" class="bg-lux-blue text-white h-7 min-w-[28px] px-2 rounded-full flex items-center justify-center text-[10px] font-black">0</span>
                    </button>
                </div>
                
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-y-20 gap-x-10"></div>
            </div>
            
            <div class="py-20 text-center opacity-20 text-[9px] font-black uppercase tracking-[0.6em] border-t border-white/5">
                © Created for Elite Entrepreneurs by Dan Tagle
            </div>
        </div>
    </template>

    <!-- Modal Dominio -->
    <div id="modal-domain" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
        <div class="max-w-lg w-full bg-lux-500 rounded-[3rem] p-10 border border-white/10 space-y-10">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-black italic">Guía de Dominio</h3>
                <button onclick="app.toggleDomainModal(false)" class="text-white/40"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-6 text-sm text-lux-400">
                <p>1. Compra tu dominio en <b>NIC.cl</b> ($9.990 x año).</p>
                <p>2. Crea cuenta en <b>Cloudflare</b> y agrega tu sitio.</p>
                <p>3. En NIC.cl, apunta los Name Servers a Cloudflare.</p>
                <p>4. En Cloudflare, apunta un CNAME a tu página de GitHub.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
