<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>tikk | Next-Gen Store Builder</title>
    
    <!-- SEO / AEO / GEO -->
    <meta name="description" content="La plataforma más avanzada para transformar Google Sheets en tiendas Apple-Style. Optimizado para SEO local y motores de respuesta (AEO).">
    <meta name="keywords" content="ecommerce apple style, dark mode shop, google sheets store, dan tagle, tikk">
    <meta name="geo.region" content="CL" />
    <meta name="geo.placename" content="Chile" />
    
    <!-- Tailwind & UI Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            50: '#f5f5f7',
                            100: '#e8e8ed',
                            400: '#86868b',
                            500: '#1d1d1f',
                            600: '#121212',
                            blue: '#0071e3'
                        },
                        obsidian: '#000000',
                    },
                    fontFamily: {
                        sans: ['SF Pro Display', 'Inter', 'system-ui', 'sans-serif'],
                    },
                    backdropBlur: {
                        'xl': '20px',
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip for the pro download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root { --safari-helper: env(safe-area-inset-bottom); }
        body { 
            background-color: #000; 
            color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Glassmorphism Pro */
        .apple-glass {
            background: rgba(29, 29, 31, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .apple-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .apple-card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5);
        }

        /* Typography & Scroll */
        ::-webkit-scrollbar { display: none; }
        .hide-scroll { scrollbar-width: none; }
        
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #86868b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Layout Helpers */
        .pb-safe { padding-bottom: calc(1.5rem + var(--safari-helper)); }
    </style>
</head>
<body class="selection:bg-apple-blue selection:text-white">

    <div id="notification-container" class="fixed top-8 right-8 z-[100] flex flex-col gap-4"></div>

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Premium Header -->
        <header class="apple-glass sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-3 group">
                    <div class="h-8 w-8 bg-white rounded-[0.5rem] flex items-center justify-center group-hover:rotate-[15deg] transition-transform duration-500">
                        <i data-lucide="command" class="text-black w-5 h-5"></i>
                    </div>
                    <span class="text-lg font-bold tracking-tight">tikk</span>
                </a>
                
                <div class="flex items-center gap-6">
                    <nav class="hidden md:flex items-center gap-8 text-[12px] font-medium text-apple-400">
                        <a href="https://dantagle.cl" target="_blank" class="hover:text-white transition-colors">Dan Tagle</a>
                        <a href="#" onclick="app.navigate('diy')" class="hover:text-white transition-colors">Crear Tienda</a>
                    </nav>
                    <button id="cart-button" onclick="app.toggleCart()" class="hidden relative p-1 text-apple-400 hover:text-white transition-all">
                        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-apple-blue text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full">0</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic Main -->
        <main id="main-content" class="flex-grow">
            <!-- Templates will be active here -->
        </main>

        <!-- Signature Footer -->
        <footer class="py-20 text-center border-t border-white/[0.05]">
            <div class="max-w-7xl mx-auto px-6">
                <p class="text-[12px] font-semibold text-apple-400 uppercase tracking-[0.3em] mb-4">Innovation in Commerce</p>
                <p class="text-[13px] text-white font-medium">
                    Handcrafted by <a href="https://dantagle.cl" target="_blank" class="text-apple-blue hover:opacity-80 transition-opacity">Dan Tagle</a>
                </p>
            </div>
        </footer>
    </div>

    <!-- Apple Style Cart Drawer -->
    <div id="cart-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity duration-500"></div>
    <aside id="cart-sidebar" class="fixed top-2 bottom-2 right-2 w-full max-w-md bg-apple-600 rounded-[2rem] z-[70] translate-x-[110%] shadow-2xl transition-transform duration-500 flex flex-col overflow-hidden border border-white/10">
        <div class="p-8 border-b border-white/5 flex items-center justify-between">
            <div>
                <h2 class="text-xl font-bold">Resumen de Pedido</h2>
                <p id="store-label-cart" class="text-[10px] text-apple-400 font-bold uppercase tracking-widest mt-1">Nombre Tienda</p>
            </div>
            <button onclick="app.toggleCart()" class="h-8 w-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-8 space-y-6"></div>
        <div class="p-8 bg-black/40 space-y-6">
            <div class="space-y-4">
                <input type="text" id="buyer-name" placeholder="Tu Nombre" class="w-full h-12 px-5 rounded-xl bg-white/5 border border-white/10 focus:border-apple-blue outline-none font-medium text-sm transition-all">
                <textarea id="order-comments" placeholder="Nota adicional..." class="w-full p-5 rounded-xl bg-white/5 border border-white/10 focus:border-apple-blue outline-none font-medium text-sm transition-all resize-none" rows="2"></textarea>
            </div>
            <div class="flex justify-between items-end border-t border-white/5 pt-6">
                <span class="text-apple-400 text-sm font-medium">Total Estimado</span>
                <span id="cart-total" class="text-3xl font-bold tracking-tight">$0</span>
            </div>
            <button onclick="app.sendOrder()" class="w-full h-14 bg-apple-blue text-white rounded-2xl font-bold text-base hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
                Pedir por WhatsApp
            </button>
        </div>
    </aside>

    <!-- TEMPLATES -->

    <!-- Template: Landing (High-CX Experience) -->
    <template id="tpl-landing">
        <div class="relative overflow-hidden">
            <!-- Hero Section -->
            <section class="max-w-7xl mx-auto px-6 pt-24 pb-40 text-center relative z-10">
                <span class="inline-block px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-[10px] font-black uppercase tracking-widest text-apple-400 mb-10">Beta Access 0.9</span>
                <h1 class="text-6xl md:text-[100px] font-bold tracking-tight leading-[0.9] mb-12 gradient-text">
                    La tienda definitiva. <br> Diseñada con Excel.
                </h1>
                <p class="text-xl md:text-2xl text-apple-400 max-w-2xl mx-auto mb-16 font-medium leading-relaxed">
                    Transforma un simple Google Sheet en una experiencia de compra Apple-Style. <span class="text-white">Con peras y manzanas.</span>
                </p>
                <div class="flex flex-col sm:flex-row items-center justify-center gap-6">
                    <button onclick="app.navigate('diy')" class="h-16 px-10 bg-white text-black rounded-full font-bold text-lg hover:bg-apple-100 transition-all active:scale-95 shadow-2xl">
                        Empezar mi transformación
                    </button>
                    <a href="https://dantagle.cl" target="_blank" class="text-apple-400 font-bold hover:text-white transition-all underline underline-offset-8">Consultoría Personalizada</a>
                </div>
            </section>

            <!-- CX Cards (Steps) -->
            <section class="max-w-7xl mx-auto px-6 pb-40">
                <div class="grid md:grid-cols-3 gap-8">
                    <div class="apple-card p-10 rounded-[2.5rem] flex flex-col justify-between h-[450px]">
                        <div>
                            <div class="h-12 w-12 bg-white/5 rounded-2xl flex items-center justify-center mb-8 border border-white/10"><i data-lucide="table" class="w-6 h-6 text-apple-blue"></i></div>
                            <h3 class="text-2xl font-bold mb-4">Paso 1: Tu Bodega</h3>
                            <p class="text-apple-400 font-medium leading-relaxed">Simplemente pon tus productos en un Excel. Tikk lee los datos en tiempo real. Si cambias un precio en el Excel, cambia en tu tienda.</p>
                        </div>
                        <div class="text-[10px] font-black uppercase tracking-widest text-white/20">Google Sheets Integration</div>
                    </div>
                    <div class="apple-card p-10 rounded-[2.5rem] flex flex-col justify-between h-[450px]">
                        <div>
                            <div class="h-12 w-12 bg-white/5 rounded-2xl flex items-center justify-center mb-8 border border-white/10"><i data-lucide="smartphone" class="w-6 h-6 text-apple-blue"></i></div>
                            <h3 class="text-2xl font-bold mb-4">Paso 2: La Conexión</h3>
                            <p class="text-apple-400 font-medium leading-relaxed">Pega el link de tu Excel y tu número de WhatsApp. Nosotros armamos el carrito, las categorías y el buscador automáticamente.</p>
                        </div>
                        <div class="text-[10px] font-black uppercase tracking-widest text-white/20">Zero Configuration</div>
                    </div>
                    <div class="apple-card p-10 rounded-[2.5rem] flex flex-col justify-between h-[450px]">
                        <div>
                            <div class="h-12 w-12 bg-white/5 rounded-2xl flex items-center justify-center mb-8 border border-white/10"><i data-lucide="rocket" class="w-6 h-6 text-apple-blue"></i></div>
                            <h3 class="text-2xl font-bold mb-4">Paso 3: Lanzamiento</h3>
                            <p class="text-apple-400 font-medium leading-relaxed">Decide si quieres hostearlo con nosotros gratis o descargar el código completo para tener tu propia página profesional.</p>
                        </div>
                        <div class="text-[10px] font-black uppercase tracking-widest text-white/20">Flexible Deployment</div>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <!-- Template: DIY (Apple Sleek Input) -->
    <template id="tpl-diy">
        <div class="max-w-2xl mx-auto px-6 py-24">
            <header class="text-center mb-16">
                <h2 class="text-4xl font-bold tracking-tight mb-4">Configuración del Salto</h2>
                <p class="text-apple-400 font-medium">Los datos que conectarán tu negocio con el mundo.</p>
            </header>
            
            <div class="space-y-6">
                <div class="apple-card p-8 rounded-4xl space-y-6">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-apple-400 mb-3 ml-1">¿Cómo llamamos a tu tienda?</label>
                        <input type="text" id="store-name-input" placeholder="Ej: Elite Sneakers" class="w-full h-14 px-6 rounded-2xl bg-white/5 border border-white/10 focus:border-apple-blue outline-none text-lg font-bold transition-all placeholder:text-white/20">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-apple-400 mb-3 ml-1">WhatsApp para Pedidos</label>
                        <input type="number" id="whatsapp-input" placeholder="Ej: 56912345678" class="w-full h-14 px-6 rounded-2xl bg-white/5 border border-white/10 focus:border-apple-blue outline-none text-lg font-bold transition-all placeholder:text-white/20">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-3 ml-1">
                            <label class="block text-[10px] font-black uppercase tracking-widest text-apple-400 text-left">Link de Google Sheet</label>
                            <a href="https://docs.google.com/spreadsheets/d/1EbB2_MSQnVYwrseGX2jbDXu4ttWDhSbMxzbfWRy7orU/edit#gid=0" target="_blank" class="text-[9px] font-bold text-apple-blue hover:text-white transition-all uppercase tracking-wider underline">Ver Plantilla Pro</a>
                        </div>
                        <input type="text" id="sheet-url-input" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full h-14 px-6 rounded-2xl bg-white/5 border border-white/10 focus:border-apple-blue outline-none text-sm font-medium transition-all placeholder:text-white/20">
                    </div>
                </div>

                <button onclick="app.generateFromDiy()" class="w-full h-16 bg-white text-black rounded-3xl font-black text-xl hover:bg-apple-100 transition-all active:scale-[0.98] shadow-2xl flex items-center justify-center gap-3">
                    Construir Mi Experiencia
                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </template>

    <!-- Template: Share (Options view) -->
    <template id="tpl-share">
        <div class="max-w-4xl mx-auto px-6 py-24 text-center">
            <h2 class="text-5xl font-bold mb-6 gradient-text" id="share-title">¡Estructura Creada!</h2>
            <p class="text-apple-400 font-medium mb-16 max-w-lg mx-auto">Selecciona el método de despliegue para tu nueva vitrina digital.</p>

            <div class="grid md:grid-cols-2 gap-8">
                <div class="apple-card p-10 rounded-4xl flex flex-col justify-between">
                    <div class="text-left">
                        <div class="h-10 w-10 bg-apple-blue/10 text-apple-blue rounded-xl flex items-center justify-center mb-6"><i data-lucide="link" class="w-5 h-5"></i></div>
                        <h3 class="text-xl font-bold mb-3">Enlace Directo tikk.cl</h3>
                        <p class="text-apple-400 text-sm leading-relaxed mb-10">Tu tienda ya está activa bajo nuestra infraestructura optimizada. Ideal para venta inmediata.</p>
                    </div>
                    <div class="space-y-4">
                        <input type="text" id="shareable-url" readonly class="w-full bg-black/40 border border-white/5 p-4 rounded-xl text-[10px] font-bold text-apple-400 truncate">
                        <button onclick="app.copyStoreLink()" class="w-full h-14 bg-white text-black rounded-2xl font-bold text-sm shadow-xl hover:bg-apple-100 transition-all">Copiar Enlace</button>
                        <a href="#" id="view-store-btn" class="block text-xs font-bold text-apple-blue hover:text-white transition-all">Ver vitrina ahora</a>
                    </div>
                </div>

                <div class="apple-card p-10 rounded-4xl bg-apple-blue flex flex-col justify-between border-none shadow-2xl shadow-apple-blue/20">
                    <div class="text-left">
                        <div class="h-10 w-10 bg-white/20 text-white rounded-xl flex items-center justify-center mb-6"><i data-lucide="folder-down" class="w-5 h-5"></i></div>
                        <h3 class="text-xl font-bold mb-3 text-white">Full Project Package</h3>
                        <p class="text-white/80 text-sm leading-relaxed mb-10">Descarga un ZIP con todo el código base profesional para subirlo a tu propio GitHub y tener autonomía total.</p>
                    </div>
                    <button id="btn-download-zip" onclick="app.downloadProZip()" class="w-full h-14 bg-white text-black rounded-2xl font-bold text-sm shadow-xl hover:bg-apple-100 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="archive" class="w-4 h-4"></i>
                        Descargar Proyecto (.zip)
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Store (The Pro Experience) -->
    <template id="tpl-store">
        <div id="store-container" class="max-w-7xl mx-auto px-6 py-12 pb-40">
            <header class="flex flex-col md:flex-row md:items-end justify-between gap-10 mb-16">
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="px-2 py-0.5 rounded bg-apple-blue text-[9px] font-black uppercase text-white">Live</span>
                        <h2 id="store-title" class="text-4xl font-bold tracking-tight">Cargando...</h2>
                    </div>
                    <!-- Pro Search Bar -->
                    <div class="relative max-w-md">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-apple-400"></i>
                        <input type="text" id="store-search" placeholder="Buscar productos..." oninput="app.handleSearch(this.value)" class="w-full h-12 pl-12 pr-6 rounded-xl bg-white/5 border border-white/10 focus:border-apple-blue outline-none font-medium text-sm transition-all focus:bg-white/10">
                    </div>
                </div>
                <!-- Categories Flex -->
                <div id="category-filters" class="flex flex-wrap gap-2 hide-scroll"></div>
            </header>

            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- Grid items injected here -->
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
