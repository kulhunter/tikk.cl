name: AI SEO Autopilot

on:
  schedule:
    # Run automatically every day at 10:00 UTC (6am Chile time)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  generate-seo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Run AI SEO Generator
        run: node ai_seo_generator.js
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated new SEO landing pages" && git push)
