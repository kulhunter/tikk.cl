<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minimarket El Progreso | Catálogo Digital TIKK</title>
    <meta name="description" content="Haz tu pedido online directamente al WhatsApp de Minimarket El Progreso.">
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0F172A;
            --bg-card: #1E293B;
            --emerald: #10B981;
            --wa-green: #25D366;
            --border: #334155;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); font-size: 15px; padding-bottom: 90px; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .store-header { background: linear-gradient(135deg, #1E293B, #0F172A); padding: 24px 16px; text-align: center; border-bottom: 1px solid var(--border); }
        .store-avatar { width: 64px; height: 64px; background: var(--emerald); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 12px; }

        .container { max-width: 900px; margin: 0 auto; padding: 16px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
        .prod-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 14px; text-align: center; }
        .prod-emoji { font-size: 38px; margin-bottom: 6px; }
        .prod-title { font-weight: 800; font-size: 14px; height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .prod-price { color: var(--emerald); font-weight: 900; font-size: 16px; margin: 6px 0; }

        .btn-add { background: var(--emerald); color: white; border: none; padding: 8px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; }

        .sticky-cart-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 74px; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .btn-order-wa { background: var(--wa-green); color: white; border: none; padding: 14px 24px; border-radius: 99px; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    </style>
</head>
<body>

    <header class="store-header">
        <div class="store-avatar">🏪</div>
        <h1 style="font-size:26px; font-weight:900;">Minimarket El Progreso</h1>
        <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">📍 Av. Providencia 1234 · Pedidos directos por WhatsApp</p>
    </header>

    <main class="container">
        <div style="font-size:18px; font-weight:900;">🛍️ Catálogo de Productos</div>

        <div class="products-grid">
            <div class="prod-card">
                <div class="prod-emoji">🥤</div>
                <div class="prod-title">Coca-Cola Original 1.5L</div>
                <div class="prod-price">$2.000</div>
                <button onclick="storeApp.addToCart('Coca-Cola 1.5L', 2000)" class="btn-add">+ Agregar</button>
            </div>
            <div class="prod-card">
                <div class="prod-emoji">🍫</div>
                <div class="prod-title">Chocolate Sahne Nuss 250g</div>
                <div class="prod-price">$3.500</div>
                <button onclick="storeApp.addToCart('Sahne Nuss 250g', 3500)" class="btn-add">+ Agregar</button>
            </div>
            <div class="prod-card">
                <div class="prod-emoji">🥛</div>
                <div class="prod-title">Leche Entera Colun 1L</div>
                <div class="prod-price">$1.150</div>
                <button onclick="storeApp.addToCart('Leche Colun 1L', 1150)" class="btn-add">+ Agregar</button>
            </div>
            <div class="prod-card">
                <div class="prod-emoji">🥔</div>
                <div class="prod-title">Papas Kryzpo 140g</div>
                <div class="prod-price">$1.400</div>
                <button onclick="storeApp.addToCart('Papas Kryzpo 140g', 1400)" class="btn-add">+ Agregar</button>
            </div>
        </div>
    </main>

    <div class="sticky-cart-bar">
        <div>
            <div style="font-size:12px; color:var(--text-muted);">TOTAL CARRITO</div>
            <div id="storeCartTotal" style="font-size:24px; font-weight:900; color:var(--emerald);">$0</div>
        </div>
        <button onclick="storeApp.sendWhatsAppOrder()" class="btn-order-wa">
            💬 Pedir por WhatsApp (<span id="cartCount">0</span>)
        </button>
    </div>

    <script>
        const storeApp = {
            cart: [],

            addToCart(name, price) {
                const found = this.cart.find(i => i.name === name);
                if (found) { found.qty += 1; }
                else { this.cart.push({ name, price, qty: 1 }); }
                this.render();
            },

            render() {
                const total = this.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
                const count = this.cart.reduce((sum, i) => sum + i.qty, 0);
                document.getElementById("storeCartTotal").textContent = "$" + total.toLocaleString("es-CL");
                document.getElementById("cartCount").textContent = count;
            },

            sendWhatsAppOrder() {
                if (this.cart.length === 0) return alert("Tu carrito está vacío. Agrega productos.");
                const itemsText = this.cart.map(i => '• ' + i.qty + 'x ' + i.name + ' ($' + (i.price * i.qty).toLocaleString('es-CL') + ')').join('%0A');
                const total = this.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
                const msg = "Hola *Minimarket El Progreso*! Quiero hacer el siguiente pedido:%0A%0A" + itemsText + "%0A%0A*TOTAL: $" + total.toLocaleString("es-CL") + "*";
                window.open("https://wa.me/56912345678?text=" + msg, "_blank");
            }
        };
    </script>
</body>
</html>
