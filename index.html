<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tikk | Crea tu tienda con Google Sheets</title>
    <meta name="description" content="Conecta tu Google Sheets y crea una tienda online con carrito de compras y pedidos por WhatsApp en segundos.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons (for that premium feel) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        [v-cloak] { display: none; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark-glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 font-sans selection:bg-primary-100 selection:text-primary-900">

    <!-- Notification Overlay -->
    <div id="notification-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2"></div>

    <!-- App Shell -->
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header / Nav -->
        <header id="app-header" class="sticky top-0 z-50 glass border-b border-gray-100">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-2 group">
                    <div class="bg-primary-600 text-white p-1.5 rounded-lg group-hover:rotate-12 transition-transform shadow-lg shadow-primary-200">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                    </div>
                    <span class="text-2xl font-black tracking-tight text-slate-900">tikk<span class="text-primary-600">.</span></span>
                </a>
                <div class="flex items-center gap-4">
                    <button id="cart-button" onclick="app.toggleCart()" class="relative p-2 text-slate-600 hover:text-primary-600 transition-colors hidden">
                        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-primary-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
                    </button>
                    <a href="https://calendly.com/dan-tagle/30min" target="_blank" class="hidden md:flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900 transition-colors">
                        Soporte Personalizado
                    </a>
                    <button onclick="app.navigate('diy')" class="bg-slate-900 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-slate-800 transition-all shadow-md active:scale-95">
                        Empezar Gratis
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content (Views) -->
        <main id="main-content" class="flex-grow">
            <!-- Content will be injected here by app.js -->
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-gray-100 py-12">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <p class="text-slate-400 text-sm">© 2024 tikk.cl - Crea tu tienda online en segundos.</p>
                <div class="mt-4 flex justify-center gap-6 text-slate-400">
                    <a href="#" class="hover:text-primary-500 transition-colors text-sm">Términos</a>
                    <a href="#" class="hover:text-primary-500 transition-colors text-sm">Privacidad</a>
                    <a href="https://github.com/kulhunter/tikk.cl" class="hover:text-primary-500 transition-colors text-sm">GitHub</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Cart Sidebar / Modal Overlay -->
    <div id="cart-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>
    <aside id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-[70] translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between bg-slate-50">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="shopping-cart" class="w-5 h-5 text-primary-600"></i>
                Tu Carrito
            </h2>
            <button onclick="app.toggleCart()" class="p-2 hover:bg-gray-200 rounded-full transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-4">
            <!-- Cart items injected here -->
            <div class="text-center py-20 text-slate-400">
                <i data-lucide="shopping-basket" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                <p>Tu carrito está vacío</p>
            </div>
        </div>
        <div class="p-6 border-t border-gray-100 bg-slate-50 space-y-4">
            <div class="flex flex-col gap-3">
                <input type="text" id="buyer-name" placeholder="Tu Nombre completo" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none text-sm transition-all font-medium">
                <textarea id="order-comments" placeholder="Instrucciones adicionales (ej: horario de entrega)" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none text-sm transition-all font-medium resize-none" rows="2"></textarea>
            </div>
            <div class="flex justify-between items-end mb-2">
                <span class="text-slate-500 font-medium">Total Estimado</span>
                <span id="cart-total" class="text-3xl font-black text-slate-900">$0</span>
            </div>
            <button onclick="app.sendOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-green-700 transition-all shadow-lg shadow-green-200 flex items-center justify-center gap-2 group active:scale-95">
                <i data-lucide="message-circle" class="w-6 h-6"></i>
                Enviar pedido por WhatsApp
            </button>
            <p class="text-[10px] text-center text-slate-400 italic">No realizas pagos aquí. Al enviar, serás redirigido a WhatsApp para coordinar con el vendedor.</p>
        </div>
    </aside>

    <!-- Templates (Hidden in DOM for SPA injection) -->
    <template id="tpl-landing">
        <div class="relative overflow-hidden">
            <!-- Background Decoration -->
            <div class="absolute top-0 left-0 w-full h-[600px] bg-gradient-to-b from-primary-50 to-white -z-10"></div>
            <div class="absolute top-20 right-[-10%] w-[500px] h-[500px] bg-primary-200/20 rounded-full blur-3xl -z-10 animate-float"></div>
            <div class="absolute bottom-20 left-[-5%] w-[400px] h-[400px] bg-blue-200/20 rounded-full blur-3xl -z-10 animate-float" style="animation-delay: 2s"></div>

            <section class="max-w-7xl mx-auto px-4 pt-20 pb-32 flex flex-col items-center text-center">
                <div class="inline-flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-primary-100 mb-8 animate-bounce">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-primary-500"></span>
                    </span>
                    <span class="text-xs font-bold text-primary-700 uppercase tracking-wider">Nuevo: Modo Google Sheets v2.0</span>
                </div>
                
                <h1 class="text-5xl md:text-7xl font-black tracking-tight text-slate-900 max-w-4xl leading-[1.1] mb-6">
                    Tu tienda online en <span class="gradient-text">un clic</span> desde tu Excel.
                </h1>
                
                <p class="text-xl text-slate-600 max-w-2xl mb-12 leading-relaxed">
                    Conecta tu Google Sheets y obtén una tienda online con carrito de compras que envía pedidos por WhatsApp. <strong>Sin saber de tecnología.</strong>
                </p>

                <div class="grid md:grid-cols-2 gap-6 w-full max-w-4xl text-left">
                    <!-- Option 1 -->
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-gray-100 flex flex-col group transition-all hover:-translate-y-1">
                        <div class="bg-primary-100 text-primary-600 w-12 h-12 rounded-2xl flex items-center justify-center mb-6">
                            <i data-lucide="zap" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-2xl font-bold mb-3">Hazlo tú mismo (Gratis)</h3>
                        <p class="text-slate-500 mb-8 flex-grow">Sigue unos pasos simples, pega el enlace de tu Google Sheet y tu tienda quedará lista en segundos.</p>
                        <button onclick="app.navigate('diy')" class="w-full bg-primary-600 text-white py-4 rounded-2xl font-bold hover:bg-primary-700 transition-all flex items-center justify-center gap-2">
                            Crear tienda ahora
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Option 2 -->
                    <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-xl shadow-slate-900/20 border border-slate-800 flex flex-col transition-all hover:-translate-y-1">
                        <div class="bg-slate-800 text-white w-12 h-12 rounded-2xl flex items-center justify-center mb-6">
                            <i data-lucide="user" class="w-6 h-6 text-primary-400"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-3">DanTagle lo hace por ti</h3>
                        <p class="text-slate-400 mb-6">Sesión online de hasta 1 hora. Configuramos tu tienda juntos usando tu Excel y la dejamos lista para vender.</p>
                        <div class="space-y-2 mb-8">
                            <div class="flex items-center gap-2 text-primary-400 font-bold text-sm">
                                <i data-lucide="check" class="w-4 h-4"></i> Costo: 1 UF
                            </div>
                            <div class="flex items-center gap-2 text-slate-400 text-xs">
                                <i data-lucide="clock" class="w-4 h-4"></i> Agenda de 30 min (extensible)
                            </div>
                        </div>
                        <a href="https://calendly.com/dan-tagle/30min" target="_blank" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-bold hover:bg-gray-100 transition-all flex items-center justify-center gap-2">
                            Agendar en Calendly
                            <i data-lucide="external-link" class="w-5 h-5"></i>
                        </a>
                    </div>
                </div>
            </section>

            <!-- How it works -->
            <section class="max-w-7xl mx-auto px-4 py-24 border-t border-gray-100">
                <div class="text-center mb-16">
                    <h2 class="text-3xl font-bold mb-4">¿Cómo funciona?</h2>
                    <p class="text-slate-500">Solo necesitas un archivo de Google Drive.</p>
                </div>
                <div class="grid md:grid-cols-3 gap-12">
                    <div class="text-center">
                        <div class="w-16 h-16 bg-white shadow-lg rounded-2xl flex items-center justify-center mx-auto mb-6 text-primary-600 border border-gray-50">
                            <span class="text-2xl font-black">1</span>
                        </div>
                        <h4 class="font-bold mb-2">Crea tu Excel</h4>
                        <p class="text-sm text-slate-500 leading-relaxed">Usa nuestras 6 columnas base: Codigo, Categoria, Producto, Stock, Precio y Foto.</p>
                    </div>
                    <div class="text-center">
                        <div class="w-16 h-16 bg-white shadow-lg rounded-2xl flex items-center justify-center mx-auto mb-6 text-primary-600 border border-gray-50">
                            <span class="text-2xl font-black">2</span>
                        </div>
                        <h4 class="font-bold mb-2">Pega tu enlace</h4>
                        <p class="text-sm text-slate-500 leading-relaxed">Asegúrate de compartir el archivo como "Cualquiera con el enlace puede ver".</p>
                    </div>
                    <div class="text-center">
                        <div class="w-16 h-16 bg-white shadow-lg rounded-2xl flex items-center justify-center mx-auto mb-6 text-primary-600 border border-gray-50">
                            <span class="text-2xl font-black">3</span>
                        </div>
                        <h4 class="font-bold mb-2">¡A vender!</h4>
                        <p class="text-sm text-slate-500 leading-relaxed">Comparte el link de tu nueva tienda y recibe pedidos directamente en tu WhatsApp.</p>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <template id="tpl-diy">
        <div class="max-w-4xl mx-auto px-4 py-16">
            <div class="text-center mb-12">
                <h2 class="text-4xl font-black text-slate-900 mb-4">Hazlo tú mismo</h2>
                <p class="text-slate-500 max-w-xl mx-auto">Crea tu propia tienda. Solo necesitas tu WhatsApp y un Google Sheet configurado.</p>
            </div>

            <div class="space-y-12">
                <!-- Step 1 -->
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
                    <div class="flex items-start gap-6">
                        <div class="bg-primary-600 text-white w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 font-bold">1</div>
                        <div class="flex-grow">
                            <h3 class="text-xl font-bold mb-4">Prepara tu archivo</h3>
                            <p class="text-slate-600 mb-6 font-medium">Tu Google Sheet debe tener exactamente estas 6 columnas (sin tildes):</p>
                            
                            <div class="overflow-x-auto rounded-xl border border-gray-200 mb-6 bg-slate-50 text-[11px]">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-100 text-slate-500 font-bold uppercase tracking-wider">
                                        <tr>
                                            <th class="px-4 py-3 border-b">Codigo</th>
                                            <th class="px-4 py-3 border-b">Categoria</th>
                                            <th class="px-4 py-3 border-b">Producto</th>
                                            <th class="px-4 py-3 border-b">Stock</th>
                                            <th class="px-4 py-3 border-b">Precio</th>
                                            <th class="px-4 py-3 border-b">LinkFoto</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200">
                                        <tr>
                                            <td class="px-4 py-3">A01</td>
                                            <td class="px-4 py-3">Poleras</td>
                                            <td class="px-4 py-3">Camiseta Algodón</td>
                                            <td class="px-4 py-3 text-center">15</td>
                                            <td class="px-4 py-3">12990</td>
                                            <td class="px-4 py-3 text-blue-500 italic">https://...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <p class="text-xs text-slate-400 mb-4">💡 El archivo debe estar compartido como <strong>"Cualquiera con el enlace puede ver"</strong>.</p>
                        </div>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
                    <div class="flex items-start gap-6">
                        <div class="bg-primary-600 text-white w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 font-bold">2</div>
                        <div class="flex-grow">
                            <h3 class="text-xl font-bold mb-4">Número de WhatsApp</h3>
                            <div class="space-y-4">
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Para recibir pedidos</label>
                                <input type="number" id="whatsapp-input" placeholder="Ej: 56912345678" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-gray-200 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none text-slate-800 font-medium transition-all">
                                <p class="text-[10px] text-slate-400">Incluye código de país sin el "+". Ej: 569... (Chile), 549... (Arg), 521... (Mex)</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
                    <div class="flex items-start gap-6">
                        <div class="bg-primary-600 text-white w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 font-bold">3</div>
                        <div class="flex-grow">
                            <h3 class="text-xl font-bold mb-4">Pega el link de Google Sheets</h3>
                            <div class="space-y-4">
                                <input type="text" id="sheet-url-input" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-gray-200 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/10 outline-none text-slate-800 font-medium transition-all">
                                <button onclick="app.generateFromDiy()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
                                    Generar Mi Tienda
                                    <i data-lucide="rocket" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-share">
        <div class="max-w-xl mx-auto px-4 py-20 text-center">
            <div class="w-24 h-24 bg-green-100 text-green-600 rounded-[3rem] flex items-center justify-center mx-auto mb-8 shadow-inner shadow-green-200 animate-bounce">
                <i data-lucide="check" class="w-12 h-12"></i>
            </div>
            <h2 class="text-4xl font-black text-slate-900 mb-4 tracking-tight">¡Tienda lista!</h2>
            <p class="text-slate-500 mb-10">Copia este enlace y envíaselo a tus clientes o ponlo en tu bio de Instagram.</p>
            
            <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl shadow-slate-200/50 border border-gray-100 mb-8">
                <div class="flex items-center gap-2 mb-6 bg-slate-50 p-4 rounded-xl border border-gray-100">
                    <input type="text" id="shareable-url" readonly class="bg-transparent border-none outline-none w-full text-slate-500 font-medium text-xs truncate">
                    <button onclick="app.copyStoreLink()" class="bg-slate-900 text-white p-3 rounded-lg hover:bg-primary-600 transition-all active:scale-90 flex-shrink-0">
                        <i data-lucide="copy" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <a href="#" id="view-store-btn" class="bg-primary-600 text-white py-4 rounded-2xl font-bold hover:bg-primary-700 transition-all flex items-center justify-center gap-2 text-sm">
                        Ver tienda
                        <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>
                    <button onclick="app.navigate('diy')" class="bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all text-sm">
                        Crear otra
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-store">
        <div id="store-view" class="max-w-7xl mx-auto px-4 py-12">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12 border-b border-gray-100 pb-8">
                <div>
                    <h2 id="store-title" class="text-4xl font-black text-slate-900 mb-2">Tienda Online</h2>
                    <p class="text-slate-500 font-medium flex items-center gap-2">
                        <i data-lucide="info" class="w-4 h-4 text-primary-500"></i>
                        Selecciona tus productos y pide por WhatsApp.
                    </p>
                </div>
                <div id="category-filters" class="flex flex-wrap gap-2">
                    <button onclick="app.filterCategory('all')" class="category-pill active bg-primary-600 text-white px-4 py-2 rounded-full text-sm font-bold shadow-md shadow-primary-200 transition-all">Todas</button>
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- Products injected here -->
                <div class="col-span-full py-20 flex flex-col items-center justify-center text-slate-300">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-primary-500 mb-4"></div>
                    <p class="font-bold text-slate-500">Cargando productos...</p>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
