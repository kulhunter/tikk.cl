<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>tikk | Crea tu tienda con Excel en 3 pasos</title>
    
    <!-- SEO Master -->
    <meta name="description" content="Tu tienda online profesional usando solo Google Sheets. Creado por Dan Tagle.">
    
    <!-- Tailwind & UI Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tech: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' },
                        dark: '#0f172a',
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .tech-card { background: white; border: 1px solid rgba(0,0,0,0.05); transition: all 0.3s ease; }
        .step-card { min-width: 300px; scroll-snap-align: center; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-900 selection:bg-tech-100">

    <!-- Notifications -->
    <div id="notification-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3"></div>

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="glass-nav sticky top-0 z-50 border-b border-slate-100">
            <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-2">
                    <div class="h-9 w-9 bg-tech-600 rounded-lg flex items-center justify-center shadow-lg transform rotate-3">
                        <i data-lucide="zap" class="text-white w-5 h-5"></i>
                    </div>
                    <span class="text-xl font-black tracking-tight">tikk<span class="text-tech-500">.</span></span>
                </a>
                
                <button id="cart-button" onclick="app.toggleCart()" class="hidden relative p-2">
                    <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                    <span id="cart-count" class="absolute top-1 right-1 bg-tech-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-grow">
            <!-- Templates injected here -->
        </main>

        <!-- Footer Universal -->
        <footer class="py-10 text-center border-t border-slate-100 bg-white">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.2em] mb-2">tikk Store Builder</p>
            <p class="text-slate-600 text-sm font-medium">
                Creado por <a href="https://dantagle.cl" target="_blank" class="text-tech-600 font-black hover:underline">Dan Tagle</a>
            </p>
        </footer>
    </div>

    <!-- Cart Overlay -->
    <div id="cart-overlay" class="fixed inset-0 bg-dark/40 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity"></div>
    <aside id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-lg bg-white z-[70] translate-x-full shadow-2xl flex flex-col sm:rounded-l-4xl transition-transform duration-500">
        <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between">
            <h2 class="text-2xl font-black">Tu Carrito</h2>
            <button onclick="app.toggleCart()" class="h-10 w-10 flex items-center justify-center bg-slate-50 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto px-8 py-6"></div>
        <div class="p-8 border-t border-slate-50 bg-slate-50/50 space-y-6">
            <input type="text" id="buyer-name" placeholder="Tu Nombre" class="w-full px-6 py-4 rounded-2xl border border-slate-100 outline-none font-bold">
            <div class="flex justify-between items-center px-2">
                <span class="text-slate-500 font-bold">Total</span>
                <span id="cart-total" class="text-3xl font-black text-dark">$0</span>
            </div>
            <button onclick="app.sendOrder()" class="w-full bg-tech-600 text-white py-5 rounded-3xl font-black text-lg flex items-center justify-center gap-3">
                <i data-lucide="message-circle" class="w-6 h-6"></i> Enviar Pedido
            </button>
        </div>
    </aside>

    <!-- TEMPLATES -->

    <!-- Template: Landing (Onboarding estilo App) -->
    <template id="tpl-landing">
        <div class="max-w-7xl mx-auto px-5 pt-12 pb-24">
            <div class="text-center mb-16">
                <h1 class="text-5xl md:text-7xl font-black tracking-tighter text-dark mb-6 leading-none">
                    Vende con <br> tu <span class="text-tech-500">Excel</span>.
                </h1>
                <p class="text-lg text-slate-500 font-medium max-w-xl mx-auto">
                    La forma más simple de tener una tienda online. Sin saber de tecnología, sin complicaciones.
                </p>
            </div>

            <!-- Paso a Paso (Cards) -->
            <div class="flex flex-col md:flex-row gap-6 mb-20">
                <div class="flex-1 bg-white p-8 rounded-4xl tech-card">
                    <div class="h-14 w-14 bg-tech-50 text-tech-600 rounded-2xl flex items-center justify-center mb-6 font-black text-xl shadow-inner">1</div>
                    <h3 class="text-2xl font-black mb-3">Haz tu lista</h3>
                    <p class="text-slate-500 font-medium leading-relaxed">Anota tus productos en un Google Sheet (como un Excel en la nube). <br><span class="text-tech-500 font-bold">Es tu bodega digital.</span></p>
                </div>
                <div class="flex-1 bg-white p-8 rounded-4xl tech-card">
                    <div class="h-14 w-14 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center mb-6 font-black text-xl shadow-inner">2</div>
                    <h3 class="text-2xl font-black mb-3">Conecta todo</h3>
                    <p class="text-slate-500 font-medium leading-relaxed">Pega el link de tu Excel aquí y pon tu número de WhatsApp. <br><span class="text-green-600 font-bold">La app hace la magia.</span></p>
                </div>
                <div class="flex-1 bg-white p-8 rounded-4xl tech-card">
                    <div class="h-14 w-14 bg-violet-50 text-violet-600 rounded-2xl flex items-center justify-center mb-6 font-black text-xl shadow-inner">3</div>
                    <h3 class="text-2xl font-black mb-3">¡A vender!</h3>
                    <p class="text-slate-500 font-medium leading-relaxed">Obtienes una web propia. Tus clientes eligen productos y te llega el pedido directo al cel.</p>
                </div>
            </div>

            <div class="flex flex-col items-center gap-6">
                <button onclick="app.navigate('diy')" class="w-full max-w-md bg-dark text-white py-6 rounded-4xl font-black text-xl shadow-2xl hover:scale-[1.02] transition-all flex items-center justify-center gap-3">
                    Empezar mi tienda ahora
                    <i data-lucide="arrow-right" class="w-6 h-6"></i>
                </button>
                <p class="text-slate-400 text-sm font-bold uppercase tracking-widest">Es gratis y toma 2 minutos</p>
            </div>
        </div>
    </template>

    <!-- Template: DIY (Formulario Simplificado) -->
    <template id="tpl-diy">
        <div class="max-w-3xl mx-auto px-5 py-16">
            <h2 class="text-3xl font-black mb-10 text-center">Configura tu Negocio</h2>
            
            <div class="space-y-6">
                <!-- WhatsApp -->
                <div class="bg-white p-8 rounded-4xl border border-slate-100 space-y-4">
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400">¿A qué WhatsApp llegan los pedidos?</label>
                    <input type="number" id="whatsapp-input" placeholder="Ej: 56912345678" class="w-full px-6 py-5 rounded-2xl bg-slate-50 outline-none text-xl font-bold focus:bg-white transition-all">
                </div>

                <!-- Store Name -->
                <div class="bg-white p-8 rounded-4xl border border-slate-100 space-y-4">
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400">¿Cómo se llama tu tienda?</label>
                    <input type="text" id="store-name-input" placeholder="Ej: Mi Dulce Negocio" class="w-full px-6 py-5 rounded-2xl bg-slate-50 outline-none text-xl font-bold focus:bg-white transition-all">
                </div>

                <!-- Excel URL -->
                <div class="bg-white p-8 rounded-4xl border border-slate-100 space-y-4">
                    <div class="flex justify-between items-end">
                        <label class="block text-xs font-black uppercase tracking-widest text-slate-400">El link de tu Google Sheet</label>
                        <a href="https://docs.google.com/spreadsheets/d/1EbB2_MSQnVYwrseGX2jbDXu4ttWDhSbMxzbfWRy7orU/edit#gid=0" target="_blank" class="text-[10px] text-tech-600 font-black underline">Ver ejemplo</a>
                    </div>
                    <input type="text" id="sheet-url-input" placeholder="Pega el link aquí..." class="w-full px-6 py-5 rounded-2xl bg-slate-50 outline-none text-lg font-bold focus:bg-white transition-all">
                </div>

                <button onclick="app.generateFromDiy()" class="w-full bg-tech-600 text-white py-6 rounded-4xl font-black text-xl shadow-xl hover:bg-tech-700 transition-all flex items-center justify-center gap-3 active:scale-95">
                    Crear mi web profesional
                    <i data-lucide="rocket" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </template>

    <!-- Template: Share (Las 2 Opciones) -->
    <template id="tpl-share">
        <div class="max-w-2xl mx-auto px-5 py-24 text-center">
            <h2 class="text-4xl font-black mb-4">¡Tienda Creada! 🥳</h2>
            <p class="text-slate-500 font-medium mb-12">Elige cómo quieres usarla. Ambas opciones son geniales.</p>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Opción 1: En Tikk.cl -->
                <div class="bg-white p-8 rounded-4xl tech-card flex flex-col items-center">
                    <div class="h-12 w-12 bg-tech-50 text-tech-500 rounded-2xl flex items-center justify-center mb-6"><i data-lucide="globe" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-black mb-3">Usar Link Tikk</h3>
                    <p class="text-sm text-slate-500 mb-8 flex-grow">Tu tienda ya está online. Usa este link corto para tus redes sociales.</p>
                    <div class="w-full space-y-3">
                        <input type="text" id="shareable-url" readonly class="w-full bg-slate-50 p-3 rounded-xl text-[10px] font-bold text-slate-400 border border-slate-100 text-center">
                        <button onclick="app.copyStoreLink()" class="w-full bg-dark text-white py-4 rounded-2xl font-black text-sm">Copiar Link</button>
                        <a href="#" id="view-store-btn" class="block w-full text-tech-600 font-black text-xs hover:underline">Ir a la tienda ahora</a>
                    </div>
                </div>

                <!-- Opción 2: Descargar para GitHub -->
                <div class="bg-slate-900 p-8 rounded-4xl tech-card flex flex-col items-center border-none shadow-2xl">
                    <div class="h-12 w-12 bg-white/10 text-white rounded-2xl flex items-center justify-center mb-6"><i data-lucide="download" class="w-6 h-6"></i></div>
                    <h3 class="text-xl font-black mb-3 text-white">Descargar Archivos</h3>
                    <p class="text-sm text-slate-400 mb-8 flex-grow">Descarga un solo archivo HTML y súbelo a tu propio GitHub para tener tu web 100% propia.</p>
                    <button onclick="app.downloadProject()" class="w-full bg-tech-500 text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center gap-2">
                        <i data-lucide="download-cloud" class="w-4 h-4"></i>
                        Bajar mi Web
                    </button>
                    <p class="text-[9px] text-slate-500 mt-4 italic">Recomendado para usuarios avanzados.</p>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-store">
        <div class="max-w-7xl mx-auto px-5 py-10 pb-32">
            <h2 id="store-title" class="text-4xl font-black text-dark mb-10 tracking-tight">Cargando Tienda...</h2>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
