name: AI SEO Autopilot

on:
  schedule:
    # Runs every day at 10:00 UTC (6am Chile time)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions:
  contents: write  # Required to push generated files back to the repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Silence deprecation warning

jobs:
  generate-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run AI SEO Generator and Sitemap
        run: node ai_seo_generator.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generated SEO pages [$(date +'%Y-%m-%d')]" && git push)
