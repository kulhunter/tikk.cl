<pre class="bg-black/50 p-6 rounded-xl border border-white/10 mt-4 text-xs font-mono text-lux-blue overflow-x-auto">
function doGet(e) {
  var action = e.parameter.action;
  if(action === 'deduct') {
    var items = JSON.parse(e.parameter.items);
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = sheet.getDataRange().getValues();
    
    for(var i=0; i<items.length; i++) {
      var id = items[i].id;
      var qty = parseInt(items[i].quantity);
      for(var r=1; r<data.length; r++) {
        if(data[r][0] == id) {
          var currentStock = parseInt(data[r][4]);
          if(currentStock >= qty) {
            sheet.getRange(r+1, 5).setValue(currentStock - qty);
          }
        }
      }
    }
    return ContentService.createTextOutput("OK").setMimeType(ContentService.MimeType.TEXT);
  }
}
</pre>
                            </li>
