<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>tikk | Vitrinas Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lux: { 50: '#f9f9f9', 100: '#efefef', 400: '#8e8e93', 500: '#1c1c1e', 600: '#000000', blue: '#0071e3' },
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { background-color: #000; color: #fff; -webkit-font-smoothing: antialiased; }
        .lux-glass { background: rgba(0, 0, 0, 0.85); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .lux-card { background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 2.5rem; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .lux-card:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-6px); box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5); }
        
        .sticky-sub { position: sticky; top: 80px; z-index: 40; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        
        #store-hero { height: 50vh; min-height: 450px; background-color: #111; }
        .hero-overlay { background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 60%, #000 100%); }
        
        ::-webkit-scrollbar { display: none; }
        
        #product-modal { transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1); }
        .drawer-open { transform: translateY(0) !important; }
        .drawer-closed { transform: translateY(100%) !important; }
        @media (min-width: 768px) { .drawer-closed { transform: translateX(100%) translateY(0) !important; } }
        
        .no-wrap { white-space: nowrap; }
    </style>
</head>
<body class="selection:bg-lux-blue selection:text-white">

    <div id="notification-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-3 w-full max-w-sm px-6"></div>

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header Principal Site -->
        <header id="main-header" class="lux-glass sticky top-0 z-[100]">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <a href="#" onclick="app.navigate('landing')" class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-white rounded-2xl flex items-center justify-center shadow-lg hover:rotate-12 transition-transform">
                        <i data-lucide="zap" class="text-black w-6 h-6 fill-current"></i>
                    </div>
                    <span class="text-2xl font-black italic tracking-tighter">tikk</span>
                </a>
                <div class="flex items-center gap-4">
                    <button onclick="app.navigate('diy')" class="bg-white text-black px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-all">Empezar</button>
                    <button id="cart-button" onclick="app.toggleCart()" class="hidden p-2 text-white/50 hover:text-white transition-colors">
                        <i data-lucide="shopping-basket" class="w-7 h-7"></i>
                    </button>
                </div>
            </div>
        </header>

        <main id="main-content" class="flex-grow">
            <!-- Templates se inyectan acá -->
        </main>

        <!-- Footer Site -->
        <footer id="global-footer" class="py-24 border-t border-white/5 bg-black text-center">
            <div class="max-w-7xl mx-auto px-6">
                <p class="text-[9px] font-black uppercase tracking-[0.5em] text-white/20 mb-10">Boutique Builder Experience</p>
                <div class="flex flex-col items-center gap-4">
                    <span class="text-white/40 text-sm">Creado por</span>
                    <a href="https://dantagle.cl" target="_blank" class="text-2xl font-black tracking-tighter hover:text-lux-blue transition-colors">Dan Tagle<span class="text-lux-blue">.</span></a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Panel de Producto (Boutique Drawer) -->
    <div id="modal-overlay" onclick="app.closeProductModal()" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[150] opacity-0 pointer-events-none transition-opacity duration-500"></div>
    <aside id="product-modal" class="fixed bottom-0 right-0 h-[85vh] md:h-full w-full md:max-w-xl bg-lux-500 z-[160] drawer-closed shadow-2xl flex flex-col md:border-l border-white/10 rounded-t-[3rem] md:rounded-l-[3rem] md:rounded-t-none">
        <button onclick="app.closeProductModal()" class="absolute top-8 right-8 h-12 w-12 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all font-bold text-lg">×</button>
        <div id="modal-content" class="flex-grow overflow-y-auto p-10 pt-20"></div>
        <div id="modal-actions" class="p-10 border-t border-white/5 bg-black/40 grid grid-cols-2 gap-4"></div>
    </aside>

    <!-- TEMPLATES -->

    <template id="tpl-landing">
        <div class="max-w-7xl mx-auto px-6 pt-32 pb-64">
            <div class="max-w-4xl">
                <h1 class="text-7xl md:text-[140px] font-black tracking-tighter leading-[0.8] mb-14 reveal">
                    Vende <br> <span class="italic text-lux-blue">superior</span>.
                </h1>
                <p class="text-xl md:text-3xl text-lux-400 font-medium mb-20 leading-relaxed max-w-2xl reveal" style="animation-delay: 0.1s">
                    Tu stock en Google Sheets convertido en una vitrina boutique de alta gama. Para PyMEs que proyectan éxito.
                </p>
                <div class="flex flex-wrap gap-8 reveal" style="animation-delay: 0.2s">
                    <button onclick="app.navigate('diy')" class="h-20 px-14 bg-white text-black rounded-[2rem] font-black text-xl hover:scale-105 shadow-2xl">Empezar ahora</button>
                    <a href="https://docs.google.com/spreadsheets/d/1EbB2_MSQnVYwrseGX2jbDXu4ttWDhSbMxzbfWRy7orU/edit#gid=0" target="_blank" class="h-20 px-10 border border-white/10 rounded-[2rem] font-bold flex items-center text-xs uppercase tracking-[0.2em] hover:bg-white/5 transition-all">Ver Plantilla Excel</a>
                </div>
            </div>
            
            <div class="mt-64 grid lg:grid-cols-2 gap-32 border-t border-white/5 pt-32">
                <div class="space-y-12">
                    <span class="text-[10px] font-black uppercase tracking-[0.4em] text-lux-blue">El nuevo estándar</span>
                    <h2 class="text-4xl md:text-5xl font-black italic leading-tight">La herramienta definitiva para el emprendedor pro.</h2>
                    <p class="text-lux-400 text-lg leading-relaxed">Actualiza tu stock en tiempo real desde tu celular. Sin paneles complejos, sin configuraciones tediosas.</p>
                </div>
                <div class="grid gap-6">
                    <button onclick="app.shareWithFriend()" class="h-20 lux-card flex items-center justify-center gap-4 text-[11px] font-black uppercase tracking-widest hover:border-lux-blue/40">
                        <i data-lucide="share" class="w-5 h-5"></i> Recomienda a un emprendedor amigo
                    </button>
                    <div class="p-10 border border-white/5 rounded-[2.5rem] bg-white/5 italic text-white/30 text-sm">
                        "Diseñado para quienes buscan un salto de calidad en su presencia digital." — Dan Tagle
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-diy">
        <div class="max-w-xl mx-auto px-6 py-24">
            <h2 class="text-5xl font-black italic mb-14 text-center">Crea tu Boutique</h2>
            <div class="lux-card p-12 space-y-12 shadow-2xl">
                <div>
                    <label class="text-[10px] font-black uppercase tracking-[0.4em] text-lux-400 mb-6 block">Marca</label>
                    <input type="text" id="store-name-input" placeholder="Nombre Boutique" class="w-full bg-transparent border-b border-white/10 py-5 text-4xl font-black outline-none focus:border-lux-blue transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase tracking-[0.4em] text-lux-400 mb-6 block">WhatsApp Ventas</label>
                    <div class="flex gap-4">
                        <select id="country-code" class="bg-white/5 px-6 rounded-2xl font-bold border border-white/5 outline-none text-lg">
                            <option value="56">🇨🇱 +56</option>
                            <option value="54">🇦🇷 +54</option>
                            <option value="52">🇲🇽 +52</option>
                            <option value="57">🇨🇴 +57</option>
                            <option value="34">🇪🇸 +34</option>
                        </select>
                        <input type="number" id="whatsapp-input" placeholder="912345678" class="flex-grow bg-transparent border-b border-white/10 py-5 text-4xl font-black outline-none focus:border-lux-blue transition-all">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase tracking-[0.4em] text-lux-400 mb-6 block">Link Google Sheet</label>
                    <input type="text" id="sheet-url-input" placeholder="Pega el enlace compartido aquí" class="w-full bg-white/5 border border-white/5 p-6 rounded-3xl outline-none focus:border-lux-blue transition-all text-sm font-medium">
                </div>
            </div>
            <button onclick="app.generateFromDiy()" class="w-full h-24 bg-white text-black rounded-full font-black text-2xl mt-12 shadow-2xl hover:scale-[1.02] active:scale-95 transition-all">Sincronizar Vitrina</button>
        </div>
    </template>

    <template id="tpl-share">
        <div class="max-w-5xl mx-auto px-6 py-24 text-center">
            <h2 class="text-6xl font-black mb-20 italic">¡Boutique Lista!</h2>
            <div class="grid md:grid-cols-2 gap-10">
                <div class="lux-card p-14 flex flex-col items-center">
                    <span class="text-[10px] font-black uppercase tracking-widest text-lux-blue mb-8">Modo SaaS</span>
                    <h3 id="share-store-name" class="text-3xl font-black mb-10 italic">Boutique</h3>
                    <a href="#" id="view-store-btn" target="_blank" class="w-full h-20 bg-white text-black rounded-3xl font-black text-lg flex items-center justify-center hover:scale-105 transition-all">VER TIENDA ONLINE</a>
                    <button onclick="app.copyStoreLink()" class="mt-10 text-[10px] font-black text-lux-blue uppercase tracking-widest hover:underline px-6 py-3 border border-lux-blue/20 rounded-full">Copiar Link para RRSS</button>
                    <input type="hidden" id="shareable-url">
                </div>
                <div class="lux-card p-14 bg-lux-blue border-none flex flex-col items-center shadow-2xl shadow-lux-blue/30">
                    <span class="text-[10px] font-black uppercase tracking-widest text-white/50 mb-8">Modo Autónomo</span>
                    <h3 class="text-3xl font-black mb-10 italic">Descargar ZIP</h3>
                    <button onclick="app.downloadProZip()" class="w-full h-20 bg-white text-black rounded-3xl font-black text-lg flex items-center justify-center hover:scale-105 transition-all">DESCARGAR ARCHIVOS</button>
                    <button onclick="app.editStoreData()" class="mt-10 text-[10px] font-black text-white/40 hover:text-white uppercase tracking-widest italic">Corregir Datos</button>
                </div>
            </div>
            
            <div class="mt-32 pt-24 border-t border-white/5 max-w-2xl mx-auto">
                <h4 class="text-3xl font-black mb-12 italic">¿Quieres usar tu propio dominio .cl?</h4>
                <div class="grid sm:grid-cols-2 gap-6">
                    <button onclick="app.toggleDomainModal(true)" class="h-20 lux-card rounded-[2rem] font-bold text-sm hover:bg-white/5 transition-all">Guía paso a paso</button>
                    <a href="https://calendly.com/dan-tagle/30min" target="_blank" class="h-20 bg-lux-blue rounded-[2rem] font-black flex flex-col items-center justify-center group">
                        <span class="text-[9px] uppercase opacity-60 group-hover:opacity-100 transition-opacity">Dan Tagle lo hace por ti</span>
                        <span class="text-lg">1 UF — Configuración Vitalicia</span>
                    </a>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-store">
        <div class="bg-black min-h-screen">
            <!-- Boutique Hero -->
            <div id="store-hero" class="relative flex items-center justify-center">
                <img id="store-hero-img" src="" class="absolute inset-0 w-full h-full object-cover reveal transition-transform duration-[20s] linear">
                <div class="absolute inset-0 hero-overlay"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-8">
                    <h1 id="store-title" class="text-6xl md:text-[120px] font-black italic tracking-tighter text-white drop-shadow-[0_10px_30px_rgba(0,0,0,0.8)] leading-none"></h1>
                    <div class="mt-8 text-[11px] font-black uppercase tracking-[0.8em] text-white/50">Curated Boutique</div>
                </div>
            </div>

            <div class="max-w-7xl mx-auto px-6 py-20 pb-48">
                <!-- Sub-header Sticky / UX Fix -->
                <nav class="flex flex-col xl:flex-row justify-between items-center gap-10 mb-24 border-b border-white/5 pb-10">
                    <div class="relative w-full max-w-sm">
                        <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-4 h-4 text-white/20"></i>
                        <input type="text" id="store-search" placeholder="Filtrar colección..." oninput="app.handleSearch(this.value)" class="w-full h-16 pl-16 pr-8 rounded-full bg-white/5 border border-white/10 outline-none text-sm transition-all focus:bg-white/10 focus:border-lux-blue/30">
                    </div>
                    
                    <div id="category-filters" class="flex flex-wrap items-center justify-center gap-3"></div>
                    
                    <!-- Bolsa Blindada -->
                    <button onclick="app.toggleCart()" class="h-16 px-10 bg-white/5 border border-white/5 rounded-full font-black text-[12px] uppercase tracking-widest flex items-center gap-6 hover:bg-white/10 transition-all no-wrap flex-shrink-0 group">
                        <span class="group-hover:text-lux-blue transition-colors">Bolsa</span>
                        <div id="cart-count-btn" class="bg-lux-blue text-white h-7 min-w-[28px] px-2.5 rounded-full flex items-center justify-center text-[10px] font-black">0</div>
                    </button>
                </nav>
                
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-y-24 gap-x-12"></div>
            </div>
            
            <div class="py-24 text-center opacity-40 border-t border-white/5">
                <p class="text-[10px] font-black uppercase tracking-[0.6em] mb-4">Official Partnership</p>
                <a href="https://dantagle.cl" target="_blank" class="text-xl font-black tracking-tighter">Dan Tagle Boutique System</a>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
